<html lang="en">

    <meta charset="utf-8" />

    <title>Cluckulator!</title>

      name="viewport"
      content="width=device-width, viewport-fit=cover, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="shortcut icon" href="icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="Cluckulator" />
    <meta
      property="og:image"
      content="https://cluckulator.seanockert.com/cover.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta

      content="https://cluckulator.seanockert.com/cover.png"

    <style>
      :root {
        --bg: #ffcc81;
        --bg-light: #f6f9c4;
        --fg: #fff;
        --color-text: #440204;
        --easing: cubic-bezier(0.4, 0, 0.2, 1);
        --anticipation: linear(
          0,
          -0.004 4.9%,
          -0.02 9.4%,
          -0.124 26.4%,
          -0.126 30.5%,
          -0.104 34.1%,
          -0.027 38.8%,
          0.108 43.1%,
          0.299 47%,
          0.817 55.2%,
          0.97 59.1%,
          1.071 63.4%,
          1.118 67.7%,
          1.127 72.6%,
          1.108 77.2%,
          1.019 90.7%,
          1.004 95.2%,
          1
        );
      }

      @font-face {
        font-family: "Cherry Bomb One";
        src: url("/cherry-bomb-one.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }

      *,
      *:after {
        box-sizing: border-box;
        margin: 0;
      }

      html {
        display: flex;
        justify-content: center;
      }

      html,
      body {
        background: var(--bg-light);
        color: var(--color-text);
        font-family: "Cherry Bomb One", sans-serif;
        font-weight: 400;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        width: 100%;
        -webkit-overflow-scrolling: none;
      }

      body {
        align-items: center;
        background: linear-gradient(
          180deg in oklab,
          var(--bg-light) 30%,
          var(--bg) 60%,
          var(--bg-light) 100%
        );
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        justify-content: center;
        padding: env(safe-area-inset-top) 0.75rem 0 0.75rem;
      }

      button {
        align-items: center;
        background-color: var(--fg);
        border-radius: 50%;
        border: none;
        color: inherit;
        cursor: pointer;
        display: flex;
        font-size: 1.5rem;
        font: inherit;
        height: 3.6rem;
        justify-content: center;
        line-height: 1;
        padding-bottom: 0.5rem;
        transition: all 0.15s var(--easing);
        width: 3.6rem;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      button:focus-visible {
        transform: scale(1.1) rotate(-3deg);
      }

      @media (hover: hover) {
        button:hover {
          transform: scale(1.1) rotate(-3deg);
        }
      }

      button:active {
        transform: scale(0.95) rotate(3deg);
      }

      .eye-closed {
        display: none;
      }

      .wing-l,
      .wing-r,
      .foot-l,
      .foot-r {
        transition: transform 0.4s var(--anticipation);
      }

      .wing-l {
        transform-origin: 70% 50%;
      }

      .wing-r {
        transform-origin: 30% 50%;
      }

      .foot-l {
        transform-origin: 55% 70%;
      }

      .foot-r {
        transform-origin: 40% 80%;
      }

      #dial-container {
        -webkit-user-select: none;
        overflow: visible;
        touch-action: none;
        user-select: none;
        z-index: 1;
      }

      #dial {
        cursor: grab;
      }

      .dragging #dial-container {
        cursor: grabbing;
      }

      .dragging .eye,
      .eyes-closed .eye {
        display: none;
      }

      .dragging .eye-closed,
      .eyes-closed .eye-closed {
        display: block;
      }

      .dragging .wing-l {
        transform: rotate(-25deg);
      }

      .dragging .wing-r {
        transform: rotate(25deg);
      }

      .dragging .foot-l {
        transform: rotate(15deg);
      }

      .dragging .foot-r {
        transform: rotate(-15deg);
      }

      .symbols {
        opacity: 0;
        transition: all 0.1s ease-out;
      }

      .symbols text {
        -webkit-user-select: none;
        user-select: none;
        fill: #440204;
      }

      .show-symbols .symbols {
        opacity: 1;
      }

      .show-symbols .active {
        fill: #f0182d;
      }

      .show-symbols .active text {
        fill: #fff;
      }

      #history {
        -webkit-overflow-scrolling: touch;
        display: flex;
        max-width: 100%;
        opacity: 0.7;
        overflow-x: auto;
        padding: 0.75rem;
        scroll-behavior: smooth;
        scrollbar-width: none;
        text-align: center;
        white-space: nowrap;
      }

      #display {
        display: flex;
        flex-wrap: wrap;
        font-size: 3.4rem;
        justify-content: center;
        line-height: 1;
        text-align: center;
        z-index: 2;
      }

      #display > b {
        width: 0.65em;
      }

      .dragend #display {
        animation: confirm 0.15s var(--anticipation) forwards;
      }

      .controls {
        bottom: 0;
        display: flex;
        font-size: 2rem;
        justify-content: space-between;
        margin: 0 auto;
        max-width: 40rem;
        padding-top: 2rem;
        width: 100%;
        z-index: 2;
      }

      .shadow {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 50%;
        height: 1rem;
        margin-bottom: -1rem;
        margin-top: -3rem;
        transition: transform 0.15s var(--easing);
        width: 5rem;
        animation: floatShadow 5s ease-in-out infinite;
      }

      .dragging .shadow,
      .dragend .shadow {
        transform: scale(1.2, 1);
        animation: none;
      }

      .feathers {
        pointer-events: none;
      }

      #dial-container {
        animation: float 5s ease-in-out infinite;
      }

      .dragging #dial-container,
      .dragend #dial-container {
        animation: none;
      }

      .eye-dizzy {
        display: none;
      }

      .eye-dizzy path {
        animation: spin 0.8s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .dizzy .eye,
      .dizzy .eye-closed {
        display: none;
      }

      .dizzy .eye-dizzy {
        display: block;
      }

      .dizzy #dial-container {
        animation: wobble 0.6s ease-in-out infinite;
      }

      @keyframes wobble {
        0%,
        100% {
          transform: rotate(0);
        }
        25% {
          transform: rotate(calc(var(--dizzy-angle) * -1)) translate3d(-0.25rem, 0, 0);
        }
        75% {
          transform: rotate(var(--dizzy-angle)) translate3d(0.25rem, 0, 0);
        }
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(0, -0.75rem, 0) scale(0.96, 1.03);
        }
      }

      @keyframes floatShadow {
        0%,
        100% {
          transform: scale(1.2, 1);
        }
        50% {
          transform: scale(1);
        }
      }

      @keyframes squeeze {
        50% {
          transform: scale(0.95, 1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes confirm {
        30% {
          transform: scale(1.3);
        }
        100% {
          transform: scale(1);
        }
      }

    </style>
  </head>

      const haptics = WebHaptics.createHaptics();

      const el = {
        ac: document.getElementById("ac"),
        back: document.getElementById("back"),
        dial: document.getElementById("dial"),
        dialContainer: document.getElementById("dial-container"),
        display: document.getElementById("display"),
        feathersGroup: document.querySelector(".feathers"),
        history: document.getElementById("history"),
        symbolsGroup: document.querySelector(".symbols"),
      };

      const config = {
        symbolPositions: [
          { angle: 45, symbol: "+", label: "+" },
          { angle: 135, symbol: "-", label: "-" },
          { angle: 225, symbol: "*", label: "x" },
          { angle: 315, symbol: "/", label: "÷" },
        ],
        numbersPerRotation: 100,
        returnTime: 600,
        soundEffect: "effect-cluck.mp3",
        placeholder: "Spin me!",
        feathersPerToken: 2,
        feathersPerResult: 5,
        maxFeathers: 30,
        dizzyTurns: 2,
        maxDizzyTime: 1200,
        dizzyBlinkTime: 250,
      };

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      // The state is always "number, symbol, number". The dial adds one token for each drag.
      const calculator = {
        state: [],
        expressions: [],
        undoStack: [],
        message: null,
        drag: null,
      };

      const timers = {
        dialReset: null,
        dizzy: null,
        dragend: null,
      };

      const audio = {
        context: null,
        data: null,
        buffer: null,
      };

      const createSymbols = () => {
        config.symbolPositions.forEach(({ angle, symbol, label }) => {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("class", "symbol");
          g.setAttribute(
            "transform",
            `translate(200 200) rotate(${angle}) translate(0 -180) rotate(180)`
          );

          const egg = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
          );
          egg.setAttribute(
            "d",
            "M58 39.3C58 53 46 64 31 64S4 53 4 39.3C4 22.2 16 0 31 0s27 22 27 39.3Z"
          );
          egg.setAttribute("transform", "translate(-31, -32)");

          const text = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
          );
          text.setAttribute("x", "0");
          text.setAttribute("y", "0");
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("dominant-baseline", "middle");
          text.setAttribute("font-size", "36");
          text.setAttribute("transform", "rotate(45)");
          text.textContent = label;

          g.appendChild(egg);
          g.appendChild(text);
          el.symbolsGroup.appendChild(g);
        });
      };

      const formatNumber = (num) => {
        const str = num.toString();
        return str.includes(".") && str.split(".")[1].length > 5
          ? Number(num.toFixed(5))
          : num;
      };

      const getLabel = (token) =>
        typeof token === "number"
          ? String(token)
          : config.symbolPositions.find(({ symbol }) => symbol === token).label;

      const expectsSymbol = () =>
        typeof calculator.state[calculator.state.length - 1] === "number";

      const getAngle = (e) => {
        const rect = el.dialContainer.getBoundingClientRect();
        const dx = e.clientX - (rect.left + rect.width / 2);
        const dy = e.clientY - (rect.top + rect.height / 2);
        return Math.atan2(dy, dx) * (180 / Math.PI) + 90;
      };

      // Return the smallest signed difference between two angles, from -180 to 180.
      const getAngleDelta = (from, to) => ((((to - from) % 360) + 540) % 360) - 180;

      const getNearestSymbol = (angle) => {
        const normalized = ((angle % 360) + 360) % 360;
        return config.symbolPositions.reduce((nearest, current) => {
          const currentDiff = Math.abs(getAngleDelta(current.angle, normalized));
          const nearestDiff = Math.abs(getAngleDelta(nearest.angle, normalized));
          return currentDiff < nearestDiff ? current : nearest;
        }).symbol;
      };

      const calculate = (left, symbol, right) => {
        if (symbol === "/" && right === 0) {
          throw new Error("Division by zero");
        }
        const result = {
          "+": left + right,
          "-": left - right,
          "*": left * right,
          "/": left / right,
        }[symbol];
        if (!Number.isFinite(result)) {
          throw new Error("Too big!");
        }
        return formatNumber(result);
      };

      const updateSymbolHighlight = (symbol) => {
        el.symbolsGroup.querySelectorAll(".symbol").forEach((g, i) => {
          g.classList.toggle(
            "active",
            config.symbolPositions[i].symbol === symbol
          );
        });
      };

      const showSymbols = (isVisible) => {
        el.dialContainer.classList.toggle("show-symbols", isVisible);
        if (!isVisible) {
          updateSymbolHighlight(null);
        }
      };

      const renderDisplay = () => {
        if (calculator.message) {
          el.display.textContent = calculator.message;
          return;
        }

        const tokens = [...calculator.state];
        const { drag } = calculator;
        if (drag && drag.mode === "number" && drag.value !== null) {
          tokens.push(drag.value);
        }

        if (tokens.length === 0) {
          el.display.textContent = config.placeholder;
          return;
        }

        el.display.replaceChildren(
          ...tokens.flatMap((token, i) => {
            const chars = [...getLabel(token)].map((char) => {
              const b = document.createElement("b");
              b.textContent = char;
              return b;
            });
            return i === 0 ? chars : [" ", ...chars];
          })
        );
      };

      const renderHistory = () => {
        el.history.textContent = calculator.expressions.join(" ... ");
        el.history.scrollLeft = el.history.scrollWidth;
      };

      const render = () => {
        renderDisplay();
        renderHistory();
      };

      const saveUndo = () => {
        calculator.undoStack.push({
          state: [...calculator.state],
          expressions: [...calculator.expressions],
        });
      };

      // Return true when the token changed the state.
      const commitToken = (token) => {
        calculator.message = null;

        if (typeof token !== "number") {
          saveUndo();
          calculator.state.push(token);
          haptics.trigger([
            { duration: 30, intensity: 0.5 },
            { delay: 60, duration: 40, intensity: 1 },
          ]);
          return true;
        }

        if (calculator.state.length < 2) {
          saveUndo();
          calculator.state.push(token);
          return true;
        }

        const [left, symbol] = calculator.state;
        try {
          const result = calculate(left, symbol, token);
          saveUndo();
          calculator.expressions.push(
            [left, symbol, token].map(getLabel).join(" ") + ` = ${result}`
          );
          calculator.state = [result];
          haptics.trigger([{ duration: 100, intensity: 0.8 }]);
          return true;
        } catch (err) {
          calculator.message = err.message;
          return false;
        }
      };

      const unlockAudio = () => {
        if (!audio.context || audio.context.state === "closed") {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audio.context = new AudioContext();
          audio.buffer = null;
        }
        // iOS can set the state to "interrupted". Only a user gesture can resume it.
        if (audio.context.state !== "running") {
          audio.context.resume().catch(() => {});
        }
        decodeSound();
      };

      const decodeSound = () => {
        if (!audio.context || !audio.data || audio.buffer) {
          return;
        }
        const context = audio.context;
        // decodeAudioData detaches the buffer, so decode a copy.
        context
          .decodeAudioData(audio.data.slice(0))
          .then((buffer) => {
            if (audio.context === context) {
              audio.buffer = buffer;
            }
          })
          .catch((error) => console.error("Error decoding audio:", error));
      };

      const loadSound = () => {
        fetch(config.soundEffect)
          .then((response) => response.arrayBuffer())
          .then((data) => {
            audio.data = data;
            decodeSound();
          })
          .catch((error) => console.error("Error loading audio:", error));
      };

      const random = (min, max) => min + Math.random() * (max - min);

      const playCluck = (pitch, delay) => {
        const source = audio.context.createBufferSource();
        source.buffer = audio.buffer;
        source.playbackRate.value = pitch;
        const gainNode = audio.context.createGain();
        gainNode.gain.value = 0.7;
        source.connect(gainNode);
        gainNode.connect(audio.context.destination);
        source.start(audio.context.currentTime + delay);
      };

      // Call only from a user gesture handler, so that iOS lets the audio play.
      // Each cluck has a random pitch. A result gets a low cluck, then a high cluck.
      const playSound = (isResult) => {
        unlockAudio();
        if (!audio.buffer) {
          return;
        }
        if (isResult) {
          playCluck(random(0.85, 0.95), 0);
          playCluck(random(1.15, 1.3), 0.14);
        } else {
          playCluck(random(0.9, 1.12), 0);
        }
      };

      // Knock feathers out from behind the chicken. Each feather pops out, floats a little, then fades.
      const spawnFeathers = (count) => {
        if (reducedMotion.matches) {
          return;
        }
        const firstSide = Math.random() < 0.5 ? -1 : 1;

        for (let i = 0; i < count; i++) {
          if (el.feathersGroup.childElementCount >= config.maxFeathers) {
            return;
          }
          const side = i % 2 === 0 ? firstSide : -firstSide;
          const feather = document.createElementNS("http://www.w3.org/2000/svg", "path");
          feather.setAttribute("fill", "#fff");
          feather.setAttribute(
            "d",
            "M-40 5C-26-10 10-16 45-6c-6 4-12 6-19 7l3 4c-16 7-38 10-58 6l4-4c-6 0-10-1-15-2Z"
          );

          const startX = 200 + side * random(80, 110);
          const startY = 200 + random(-30, 40);
          const popX = side * random(25, 55);
          const popY = -random(20, 50);
          const drift = side * random(15, 45);
          const sway = random(8, 16);
          const fall = random(50, 90);
          const scale = random(0.45, 0.7);
          const startRotation = random(-30, 30);
          const popRotation = startRotation + side * random(20, 50);

          const frame = (offset, x, y, rotation, opacity) => ({
            offset,
            opacity,
            easing: "ease-in-out",
            transform: `translate(${startX + x}px, ${startY + y}px) rotate(${rotation}deg) scale(${side * scale}, ${scale})`,
          });

          el.feathersGroup.appendChild(feather);
          const animation = feather.animate(
            [
              {
                ...frame(0, 0, 0, startRotation, 1),
                easing: "cubic-bezier(0.2, 0.8, 0.3, 1)",
              },
              frame(0.25, popX, popY, popRotation, 1),
              frame(0.55, popX + drift * 0.5 + sway, popY + fall * 0.4, popRotation - side * 20, 0.7),
              frame(1, popX + drift - sway, popY + fall, popRotation + side * 10, 0),
            ],
            {
              delay: random(0, 120),
              duration: random(700, 1000),
              fill: "backwards",
            }
          );
          animation.onfinish = () => feather.remove();
        }
      };

      const stopDizzy = () => {
        clearTimeout(timers.dizzy);
        document.documentElement.classList.remove("dizzy", "eyes-closed");
      };

      // Make the chicken dizzy after a long spin. More turns give a bigger wobble for longer.
      // The eyes stay closed while the dial returns, go dizzy, then close again before they open.
      const startDizzy = (turns) => {
        if (turns < config.dizzyTurns || reducedMotion.matches) {
          return;
        }
        const extraTurns = turns - config.dizzyTurns;
        const root = document.documentElement;
        root.style.setProperty("--dizzy-angle", `${Math.min(4 + extraTurns * 2, 12)}deg`);
        stopDizzy();
        root.classList.add("eyes-closed");

        timers.dizzy = setTimeout(() => {
          root.classList.replace("eyes-closed", "dizzy");
          timers.dizzy = setTimeout(() => {
            root.classList.replace("dizzy", "eyes-closed");
            timers.dizzy = setTimeout(stopDizzy, config.dizzyBlinkTime);
          }, Math.min(500 + extraTurns * 200, config.maxDizzyTime));
        }, config.returnTime);
      };

      // Event handlers
      const handleStart = (e) => {
        if (calculator.drag || !e.isPrimary) {
          return;
        }
        e.preventDefault();

        clearTimeout(timers.dialReset);
        stopDizzy();
        el.dial.style.transition = "none";
        el.dial.style.transform = "rotate(0deg)";

        const mode = expectsSymbol() ? "symbol" : "number";
        showSymbols(mode === "symbol");
        document.documentElement.classList.add("dragging");

        try {
          el.dial.setPointerCapture(e.pointerId);
        } catch {
          // The pointer is not active (for example, a synthetic event).
        }

        calculator.drag = {
          pointerId: e.pointerId,
          mode,
          lastAngle: getAngle(e),
          rotation: 0,
          distance: 0,
          value: null,
        };
      };

      const handleMove = (e) => {
        const { drag } = calculator;
        if (!drag || e.pointerId !== drag.pointerId) {
          return;
        }

        const angle = getAngle(e);
        const delta = getAngleDelta(drag.lastAngle, angle);
        drag.rotation += delta;
        drag.distance += Math.abs(delta);
        drag.lastAngle = angle;

        if (drag.mode === "symbol") {
          drag.value = getNearestSymbol(drag.rotation);
          updateSymbolHighlight(drag.value);
        } else {
          drag.value = Math.floor(
            (drag.rotation / 360) * config.numbersPerRotation
          );
          calculator.message = null;
          renderDisplay();
        }

        el.dial.style.transform = `rotate(${drag.rotation}deg)`;
      };

      const finishDrag = (isCommit) => {
        const { drag } = calculator;
        calculator.drag = null;
        document.documentElement.classList.remove("dragging");

        el.dial.style.transition = `transform ${config.returnTime}ms cubic-bezier(0.4, 0.0, 0.2, 1)`;
        el.dial.style.transform = "rotate(0deg)";

        const expressionCount = calculator.expressions.length;
        if (isCommit && drag.value !== null && commitToken(drag.value)) {
          const isResult = calculator.expressions.length > expressionCount;
          playSound(isResult);
          spawnFeathers(
            isResult ? config.feathersPerResult : config.feathersPerToken
          );
          document.documentElement.classList.add("dragend");
          clearTimeout(timers.dragend);
          timers.dragend = setTimeout(() => {
            document.documentElement.classList.remove("dragend");
          }, 1400);
        }
        render();
        startDizzy(drag.distance / 360);

        timers.dialReset = setTimeout(() => {
          el.dial.style.transition = "none";
          showSymbols(expectsSymbol());
        }, config.returnTime);
      };

      const handleEnd = (e) => {
        if (calculator.drag && e.pointerId === calculator.drag.pointerId) {
          finishDrag(true);
        }
      };

      const handleCancel = (e) => {
        if (calculator.drag && e.pointerId === calculator.drag.pointerId) {
          finishDrag(false);
        }
      };

      const clear = () => {
        if (calculator.drag) {
          finishDrag(false);
        }
        calculator.state = [];
        calculator.expressions = [];
        calculator.undoStack = [];
        calculator.message = null;
        showSymbols(false);
        render();
      };

      const back = () => {
        if (calculator.drag) {
          finishDrag(false);
        }
        const previous = calculator.undoStack.pop();
        if (previous) {
          calculator.state = previous.state;
          calculator.expressions = previous.expressions;
        }
        calculator.message = null;
        showSymbols(expectsSymbol());
        render();
      };

      const init = () => {
        el.ac.addEventListener("click", clear);
        el.back.addEventListener("click", back);
        el.dial.addEventListener("pointerdown", handleStart);
        document.addEventListener("pointermove", handleMove);
        document.addEventListener("pointerup", handleEnd);
        document.addEventListener("pointercancel", handleCancel);
        el.dial.addEventListener("lostpointercapture", handleCancel);
        // Keep these listeners, because iOS can interrupt the audio at any time.
        document.addEventListener("pointerup", unlockAudio, true);
        document.addEventListener("keydown", unlockAudio, true);
        createSymbols();
        loadSound();
        render();
      };

      init();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js");
      }
    </script>
  </body>
</html>
